# ==============================================================================
# CI — Forgejo
# ==============================================================================
# Forgejo looks for .forgejo/workflows first and only falls back to
# .github/workflows when it is absent — a fallback, not a union. This file
# existing is what keeps a GitHub-shaped workflow from running here.
#
# Every job runs on the VPS that also serves mail, git and a minecraft server,
# so this is one job rather than several: the runner's cache is disabled and its
# valid_volumes allow-list has no nix store entry, so nothing is reused between
# runs and parallel jobs would each pay for the dev shell again.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and evaluate
    # Declared in the runner config as `nix:docker://nixos/nix:2.35.2`.
    #
    # NOT node-22, even though this is a Node package. That image has node but
    # no nix, so the toolchain CI uses would be whatever the image ships rather
    # than what flake.nix pins — exactly the drift between "works on my machine"
    # and "works in CI" that a flake exists to prevent. Here node and pnpm both
    # come from `nix develop`, so a green run means the same versions a
    # contributor gets.
    #
    # The trade: nixos/nix carries nix, bash, gitMinimal, curl and coreutils and
    # nothing else. No node in the JOB container itself — and every JavaScript
    # action is run by a node binary inside it — so no step below can be a
    # `uses:`, actions/checkout included.
    runs-on: nix

    # The image ships no experimental features. NIX_CONFIG is merged with the
    # image's /etc/nix/nix.conf rather than replacing it, which matters: that
    # file sets `sandbox = false`, and the runner gives jobs `privileged:
    # false`, so a build that tried to open a user namespace would fail.
    env:
      NIX_CONFIG: experimental-features = nix-command flakes

    steps:
      # actions/checkout's replacement — see the `runs-on` note for why it
      # cannot be the action.
      #
      # refs/pull/* is fetched alongside the branches so one command serves all
      # three triggers: on a pull_request $GITHUB_SHA is the merge commit, which
      # no branch reaches.
      - name: Checkout
        run: |
          git init -q -b main .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git fetch -q --prune --depth=1 origin \
            "+refs/heads/*:refs/remotes/origin/*" \
            "+refs/pull/*:refs/pull/*"
          git checkout -q --detach "$GITHUB_SHA"

      # --frozen-lockfile, so a dependency that drifted from the lockfile fails
      # here rather than resolving to something no one tested.
      - name: Install
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Lint
        run: nix develop -c pnpm lint

      # The suite asserts behaviour, not snapshots: that braces in prose survive
      # as text, that KaTeX reaches the server-rendered HTML, and that generated
      # modules compile. See test/ for what each case is guarding.
      - name: Test
        run: nix develop -c pnpm test

      - name: Evaluate the flake
        run: nix flake check --all-systems --no-build --print-build-logs
