# ==============================================================================
# Publish — @skavex/skavex to this instance's package registry
# ==============================================================================
# npm is the canonical registry and is published by hand, because publishing
# there is irreversible: npm will not let a version number be reused, so it is
# not something a push should be able to do on its own.
#
# This publishes the SAME version to Forgejo's own npm registry, so the package
# is installable from the instance that hosts its source:
#
#   https://git.hu-tao.dev/api/packages/skavex/npm/
#
# Forgejo's registry is append-only per version too, so re-running this for a
# version that already exists fails. That is intended rather than a problem:
# the tag is the identity, and a tag that has been published is done.
#
# ── The token ─────────────────────────────────────────────────────────────────
# Three things get confused here, so: the credential is a FORGEJO access token.
# Nothing about the package registry is GitHub's — `GITHUB_TOKEN` is a
# compatibility alias Forgejo injects under GitHub's names so that workflows
# written for GitHub port across, and reserving the GITHUB_, FORGEJO_, GITEA_
# and GITLAB_ prefixes for secret names is how it keeps them to itself. That is
# why a secret cannot be CREATED under any of them, and why hutao/vps names its
# Renovate secret RENOVATE_TOKEN.
#
# The injected token is scoped to this REPOSITORY. Publishing a package is an
# OWNER-level scope, so the repository token is the wrong shape for the job
# even where it is readable — which is the reason for an explicit one here,
# rather than the prefix rule on its own.
#
# Create it once, by hand, exactly like the Renovate one:
#
#   1. As the account that should own the uploads — a bot account rather than a
#      person, so `published by` in the package list is not someone's name:
#      /user/settings/applications -> Generate New Token, with WRITE on
#      `package`. Nothing else is needed; this workflow only uploads.
#   2. Paste it at
#      git.hu-tao.dev/skavex/skavex/settings/actions/secrets as PACKAGES_TOKEN.
#   3. Give that account write on the skavex org, or the upload is refused for
#      an owner it cannot publish under.
#
# The account owning the token decides nothing about WHERE the package lands —
# that is `github.repository_owner` in the registry URL below — only whether it
# is allowed to.
name: Publish

on:
  push:
    tags: ['v*']
  # So the first run does not require cutting a tag to find out whether the
  # token has the permission it needs.
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to the Forgejo package registry
    runs-on: nix

    env:
      NIX_CONFIG: experimental-features = nix-command flakes

    steps:
      # Tags fetched as well as the commit: prepublishOnly runs the test suite,
      # and pnpm wants to see the ref it is publishing from.
      - name: Checkout
        run: |
          git init -q -b main .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git fetch -q --tags origin "$GITHUB_SHA"
          git checkout -q --detach "$GITHUB_SHA"

      # Before anything is built or uploaded, because a missing token is a
      # configuration mistake and should not look like a publish failure three
      # minutes later.
      - name: Check the token is set
        env:
          # Through the environment rather than interpolated into the script:
          # `${{ secrets.X }}` in a `run:` block is substituted into the shell
          # source before it executes, which puts the value in the rendered
          # script. Reading it from the environment keeps it out.
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$PACKAGES_TOKEN" ]; then
            echo "PACKAGES_TOKEN is not set on this repository." >&2
            echo "See the header of .forgejo/workflows/publish.yml for how to create it." >&2
            exit 1
          fi

      - name: Install
        run: nix develop -c pnpm install --frozen-lockfile

      # The version in package.json is the identity; a tag that disagrees with
      # it would publish something nobody asked for under a name implying
      # otherwise. Checked before anything is uploaded.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(nix develop -c node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Publish
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          registry="${{ github.server_url }}/api/packages/${{ github.repository_owner }}/npm/"

          # Written outside the working tree on purpose. A config holding a live
          # token inside the checkout is one `git add -A` away from a commit,
          # and the workspace is not a place to leave one lying around.
          #
          # ${PACKAGES_TOKEN} is left for npm to expand from the environment
          # rather than interpolated here, so the value never reaches the file.
          config="$(mktemp -d)/npm-auth"
          {
            printf 'registry=%s\n' "$registry"
            printf '%s:_authToken=${PACKAGES_TOKEN}\n' "${registry#https:}"
          } > "$config"

          # NPM_CONFIG_USERCONFIG rather than `--userconfig`: that flag is
          # npm's, and `pnpm publish` rejects it outright. pnpm reads npm's
          # configuration from the environment, and expands ${VAR} inside the
          # file it points at, which is what keeps the token out of the file.
          #
          # --no-git-checks: the checkout above is a detached HEAD, which pnpm
          # otherwise refuses to publish from.
          NPM_CONFIG_USERCONFIG="$config" nix develop -c pnpm publish \
            --registry "$registry" \
            --no-git-checks \
            --access public
