# ==============================================================================
# Pages — the playground and the book at pages.hu-tao.dev/skavex/skavex
# ==============================================================================
# Two things are published from here, into one directory tree:
#
#   /skavex/skavex/        the playground in demo/
#   /skavex/skavex/docs/   the mdBook in docs/
#
# The playground is the library's own argument: markdown and LaTeX go in,
# rendered HTML and a running Svelte component come out, in a browser, from the
# same `render` and `buildModule` a consumer's build calls.
#
# The playground stays at the root because that is the URL already linked from
# the README badge, from npm and from the book. Moving it to make room for the
# book would break all three to save one path segment.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    name: Build and publish the playground and the book
    # Same image as ci.yml, for the same reason: node and pnpm come from
    # flake.nix, so the demo is built with the toolchain the tests ran under.
    # No node in the container means no `uses:` — hence the manual checkout.
    runs-on: nix

    env:
      NIX_CONFIG: experimental-features = nix-command flakes

    steps:
      - name: Checkout
        run: |
          git init -q -b main .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git fetch -q --prune --depth=1 origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout -q --detach "$GITHUB_SHA"

      - name: Install
        run: nix develop -c pnpm install --frozen-lockfile

      # The URL layout IS the directory layout — nothing rewrites — so every
      # asset URL has to carry the /<owner>/<repo> prefix the site is served
      # under. Without this the page loads and then requests /assets/... at the
      # host root and renders unstyled.
      - name: Build the playground
        run: nix develop -c pnpm run demo:build
        env:
          BASE_PATH: /${{ github.repository }}

      # mdbook resolves its own asset links relative to each page, so unlike
      # the Vite build it needs no base path — only book.toml's site-url, which
      # is what makes the sidebar's links absolute.
      - name: Build the book
        run: nix develop -c pnpm run docs:build

      # Self-hosted because codecov and its equivalents need the repository to be
      # on GitHub, GitLab or Bitbucket, and this one is on a Forgejo instance.
      # Writing the file into the published directory means shields.io reads it
      # back through its endpoint API, with no third party seeing the repository
      # and nothing to keep in sync.
      - name: Coverage badge
        run: |
          nix develop -c pnpm test:coverage
          nix develop -c node scripts/coverage-badge.js demo/dist/coverage.json

      # THE JOB NO LONGER WRITES THE SITE — IT UPLOADS IT.
      #
      # This used to mount `pages_data:/pages` and copy the three trees into it.
      # That worked while the Actions runner lived on the same box as caddy, and
      # it is exactly what the move to a separate runner forbids: it is the
      # runner reaching into the web server's storage.
      #
      # The failure mode after that move is worth knowing, because it is silent.
      # The new runner sets `valid_volumes: []`, which does not reject the
      # workflow — it drops the mount. The copies then succeed into the
      # container's own filesystem and vanish when the job ends, so the run is
      # GREEN and the published site simply never changes.
      #
      # The VPS pulls instead: modules/pages-pull.nix in the vps repo polls
      # every five minutes for the newest artifact named exactly `pages` and
      # unpacks it to <pages volume>/<owner>/<repo>. The name is the contract,
      # and the artifact's own root becomes that directory — hence assembling
      # the exact tree here first rather than uploading three paths.
      - name: Assemble the published tree
        run: |
          rm -rf _site
          mkdir -p _site/docs _site/coverage
          cp -r demo/dist/. _site/
          cp -r docs/book/. _site/docs/
          cp -r coverage/lcov-report/. _site/coverage/

      # upload-artifact is a JavaScript action, and this job runs on the `nix`
      # label — nixos/nix carries no node, which is the same reason Checkout
      # above is a hand-written `git fetch` rather than actions/checkout. The
      # dev shell already has nodejs for pnpm, so put that one on PATH instead
      # of pulling a second toolchain into the job.
      - name: Put the dev shell's node on PATH for the upload action
        run: |
          node_bin=$(nix develop -c bash -c 'command -v node')
          if [ -z "$node_bin" ]; then
            echo "no node in the dev shell — upload-artifact cannot run" >&2
            exit 1
          fi
          dirname "$node_bin" >> "$GITHUB_PATH"

      # forgejo/... AND NOT actions/..., which is not a mirror choice — it is
      # the only version of this action that can run here at all.
      #
      # actions/upload-artifact@v4 bundles @actions/artifact v2, which opens
      # every upload with a hostname test:
      #
      #     const isGitHubHost = hostname === 'GITHUB.COM'
      #     const isGheHost    = hostname.endsWith('.GHE.COM')
      #     return !isGitHubHost && !isGheHost && !isLocalHost
      #
      # GITHUB_SERVER_URL here is https://git.hu-tao.dev, so the library
      # concludes it is talking to a self-hosted GitHub Enterprise Server and
      # throws GHESNotSupportedError before opening a socket. Forgejo is not
      # GHES and the API it needs is right there; the client simply refuses to
      # look. That is why the failure was invisible at every layer below this
      # one — caddy's access log recorded ZERO artifact requests from the
      # runner, because none was ever made.
      #
      # The Forgejo fork is one commit on top of the same upstream release,
      # titled "disable GHES check", and the commit is the whole diff:
      # isGhes() returns false. Same node20 runtime, same inputs, same twirp
      # calls (CreateArtifact/FinalizeArtifact against
      # /twirp/github.actions.results.api.v1.ArtifactService/, which the VPS's
      # caddy allow-list carries for exactly this reason).
      #
      # Downgrading to @v3 would also dodge the check, by using the retired v3
      # upload API. Deprecated upstream and a step backwards for no gain.
      #
      # The bare owner/repo form resolves against the instance's
      # [actions] DEFAULT_ACTIONS_URL, which is unset here and so takes
      # Forgejo's own default of https://code.forgejo.org. Note that this is
      # ALREADY where a bare `actions/...` goes: code.forgejo.org/actions is a
      # plain mirror of GitHub's actions, GHES check and all, so switching
      # owner is the whole fix -- there is no alias that could make
      # `actions/upload-artifact` mean the fork, and nothing here was ever
      # reaching github.com to begin with.
      - name: Publish
        uses: forgejo/upload-artifact@v5
        with:
          name: pages
          path: _site/
          # An empty upload would otherwise be a green run that quietly leaves
          # the last good site in place forever.
          if-no-files-found: error
