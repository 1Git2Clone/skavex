# ==============================================================================
# Pages — the playground and the book at pages.hu-tao.dev/skavex/skavex
# ==============================================================================
# Two things are published from here, into one directory tree:
#
#   /skavex/skavex/        the playground in demo/
#   /skavex/skavex/docs/   the mdBook in docs/
#
# The playground is the library's own argument: markdown and LaTeX go in,
# rendered HTML and a running Svelte component come out, in a browser, from the
# same `render` and `buildModule` a consumer's build calls.
#
# The playground stays at the root because that is the URL already linked from
# the README badge, from npm and from the book. Moving it to make room for the
# book would break all three to save one path segment.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    name: Build and publish the playground and the book
    # Same image as ci.yml, for the same reason: node and pnpm come from
    # flake.nix, so the demo is built with the toolchain the tests ran under.
    # No node in the container means no `uses:` — hence the manual checkout.
    runs-on: nix

    container:
      # The one volume the runner's allow-list permits, and the same one caddy
      # serves read-only. Any other entry here is refused outright. See
      # modules/containers/forgejo-runner.nix in the vps repo.
      volumes:
        - pages_data:/pages

    env:
      NIX_CONFIG: experimental-features = nix-command flakes

    steps:
      - name: Checkout
        run: |
          git init -q -b main .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}"
          git fetch -q --prune --depth=1 origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout -q --detach "$GITHUB_SHA"

      - name: Install
        run: nix develop -c pnpm install --frozen-lockfile

      # The URL layout IS the directory layout — nothing rewrites — so every
      # asset URL has to carry the /<owner>/<repo> prefix the site is served
      # under. Without this the page loads and then requests /assets/... at the
      # host root and renders unstyled.
      - name: Build the playground
        run: nix develop -c pnpm run demo:build
        env:
          BASE_PATH: /${{ github.repository }}

      # mdbook resolves its own asset links relative to each page, so unlike
      # the Vite build it needs no base path — only book.toml's site-url, which
      # is what makes the sidebar's links absolute.
      - name: Build the book
        run: nix develop -c pnpm run docs:build

      # Self-hosted because codecov and its equivalents need the repository to be
      # on GitHub, GitLab or Bitbucket, and this one is on a Forgejo instance.
      # Writing the file into the published directory means shields.io reads it
      # back through its endpoint API, with no third party seeing the repository
      # and nothing to keep in sync.
      - name: Coverage badge
        run: |
          nix develop -c pnpm test:coverage
          nix develop -c node scripts/coverage-badge.js demo/dist/coverage.json

      - name: Publish
        run: |
          dest="/pages/$GITHUB_REPOSITORY"
          rm -rf "$dest" && mkdir -p "$dest/docs" "$dest/coverage"
          cp -r demo/dist/. "$dest/"
          cp -r docs/book/. "$dest/docs/"
          cp -r coverage/lcov-report/. "$dest/coverage/"
